# ThePickLog — automated daily scan + grade. Runs on GitHub's servers.
# Data source: Yahoo Finance via yfinance — NO API key or secret needed.
name: ThePickLog daily

on:
  workflow_dispatch:
    inputs:
      command:
        description: "scan or grade"
        default: scan
      # Sent by api/cron-scan.js (2026-10-25): the expiry GitHub reports for the
      # dispatch token, so this workflow can warn BEFORE the primary trigger dies.
      token_expires:
        description: "dispatch-token expiry reported by GitHub (set by the Vercel trigger)"
        required: false
        default: ""
  schedule:
    # 07:00 ET. Was 07:30 ET until 2026-08-04, when a review found GitHub's
    # best-effort cron had drifted past the 09:30 opening bell on 7 occasions and
    # logged anyway. Moving it earlier buys ~2h20m of margin before the hard
    # pre-open gate in market_time.py, which is what actually enforces the rule.
    #
    # TWO scan crons since 2026-08-29. Earlier margin was not enough: on 08-27 and
    # 08-28 GitHub did not merely delay the 11:00 dispatch, it delivered it ~10
    # hours late (20:49 and 21:16 UTC). The gate refused both, correctly, and the
    # cost was two sessions permanently missing from the record — a pick logged
    # after the bell can never be backfilled. Margin cannot fix a dropped
    # dispatch; only a second independent one can. Whichever cron lands first
    # logs the cohort, and the "Decide command" step below makes the other a
    # clean no-op. Both must be dropped to lose a session.
    #
    # LADDERED 2026-09-02. The twin-cron fix above was built on a wrong diagnosis.
    # It assumed GitHub was DROPPING dispatches, so a second independent trigger
    # would survive. The week of data says otherwise: every dispatch fires, and
    # they are all delayed by roughly the SAME amount (08-31 ~7h, 09-01 ~4.5h,
    # 09-02 ~4h), so both rungs landed past the 09:20 ET cutoff and 08-31, 09-01
    # and 09-02 were lost on top of 08-27 and 08-28. Redundancy was the wrong axis;
    # MARGIN is the right one. On 09-02 the first dispatch missed the cutoff by
    # only 43 minutes, so each extra hour of margin genuinely buys a session.
    #
    # These rungs are a BACKUP now. The primary trigger is Vercel Cron calling
    # workflow_dispatch (api/cron-scan.js) — a different scheduler on a different
    # clock, which is the only thing that actually addresses the failure. Whichever
    # trigger arrives first logs the cohort; the same-day idempotency guard below
    # makes every later arrival a clean no-op, so the ladder is free.
    #
    # The early rungs are safe because the scanner now has a FLOOR as well as a
    # ceiling: a dispatch that lands before 06:00 ET exits 0 without logging and
    # without writing a skipped-session row (market_time.SCAN_FLOOR).
    - cron: "0 07 * * 1-5"    # ~3:00am ET — only useful under heavy drift
    - cron: "0 08 * * 1-5"    # ~4:00am ET
    - cron: "0 09 * * 1-5"    # ~5:00am ET
    - cron: "0 10 * * 1-5"    # ~6:00am ET scan — redundant trigger
    - cron: "0 11 * * 1-5"    # ~7:00am ET scan (UTC; shifts 1h in winter)
    - cron: "0 21 * * 1-5"    # ~5:00pm ET grade

permissions:
  contents: write
  issues: write   # 2026-10-25: primary-trigger and token-expiry alarms (see below)

# Two scan crons (10:00 and 11:00 UTC) plus the grade cron share this one workflow,
# and GitHub runs concurrent dispatches in PARALLEL by default. Under the same drift
# the second cron exists to survive, the two scan dispatches can arrive a minute
# apart: both check out a picks.csv that has no cohort for today, both therefore PASS
# the same-day idempotency guard in "Decide command" (it reads the file, and cannot
# see another runner mid-scan), and the second appends a DIFFERENT set of tickers to
# the same session — screened minutes later against a market that has moved. That is
# precisely the cohort inflation the guard was added to prevent, and the guard alone
# cannot prevent it, because the state it tests is only true after the first run has
# PUSHED. Serialising the workflow is what makes that guard sound: the queued run
# starts after the first has pushed, sees the cohort, and no-ops.
#
# cancel-in-progress is false on purpose — a scan already in flight is the one worth
# keeping, and cancelling it mid-write is how you get a half-written cohort.
concurrency:
  group: thepicklog-daily-${{ github.ref }}
  cancel-in-progress: false


jobs:
  run:
    runs-on: ubuntu-24.04   # pinned 2026-10-07: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install "yfinance==1.7.0" "pandas==3.0.6" "numpy==2.4.6"   # pinned 2026-10-07 (versions CI ran through Sept–Oct)
      # The pre-open rule is load-bearing for every claim on the site, so its
      # selftest gates the run rather than merely reporting. If timeliness logic
      # is broken, logging nothing is the correct outcome.
      - name: Verify pre-open timing rules
        run: python market_time.py
      - name: Decide command
        id: cmd
        run: |
          CMD=scan
          if [ "${{ github.event.schedule }}" = "0 21 * * 1-5" ]; then CMD=grade; fi
          if [ -n "${{ github.event.inputs.command }}" ]; then CMD="${{ github.event.inputs.command }}"; fi
          # Same-day idempotency guard (2026-08-29), the other half of the twin
          # scan crons above. The scanner already dedupes on (ticker, date), but
          # that is not enough: a second scan an hour later screens a moved market
          # and would append DIFFERENT tickers to the same cohort, inflating it
          # with names chosen later in the morning. The cohort must be whatever
          # the first successful run saw. Keyed on the ET trading date — the
          # runner clock is UTC, and a late-evening UTC run would otherwise stamp
          # tomorrow's date on a session that has already closed.
          if [ "$CMD" = "scan" ] && [ -f picks.csv ]; then
            TODAY=$(TZ=America/New_York date +%F)
            if cut -d, -f3 picks.csv | grep -qxF "$TODAY"; then
              echo "Cohort for $TODAY is already logged — this scan is a no-op."
              CMD=noop
            fi
          fi
          # PRE-OPEN GATE, DECIDED UP FRONT (2026-09-23). The gate itself is unchanged
          # and still lives in market_time.py; what changes is WHERE a refusal is
          # discovered. Discovering it inside the scan meant exit 1, which painted a
          # correct, healthy decision as a build failure - five red runs on 09-14 alone
          # - and trained the operator to ignore the one alert that also reports a
          # broken scanner. A refused session is a no-op with a ledger row, not a
          # failure, so it now joins the existing noop path: every downstream data step
          # is skipped exactly as it is for an already-logged cohort, and the lost
          # session is reported to healthchecks.io instead, where it reaches someone.
          REFUSED=0
          if [ "$CMD" = "scan" ]; then
            GATE=$(python ignitionscan.py gate-check)
            echo "$GATE"
            case "$GATE" in
              gate=refused*) CMD=noop; REFUSED=1 ;;
            esac
          fi
          echo "refused=$REFUSED" >> "$GITHUB_OUTPUT"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
      # PRIMARY-TRIGGER ALARM (2026-10-25). The Vercel Cron → workflow_dispatch trigger
      # fires at ~11:56 UTC and normally logs the cohort before any GitHub rung arrives,
      # so every later scheduled run is a no-op. From 10-16 to 10-24 it silently stopped
      # (the fine-grained dispatch token, first used 09-16, appears to have hit a 30-day
      # expiry). Nothing alarmed: the late GitHub rungs still logged cohorts, so the
      # watchdog and healthchecks stayed green — until 10-19, when every rung landed past
      # the 09:20 cutoff and the session was lost. The signature was visible from day one:
      # a SCHEDULED run that has to scan (or is refused) on a real session means the
      # primary trigger did not log the cohort. Say so on that first morning, while there
      # is still time to fix it before a session is lost. Never fails the run.
      - name: Primary-trigger alarm
        if: github.event_name == 'schedule' && (steps.cmd.outputs.cmd == 'scan' || steps.cmd.outputs.refused == '1')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFUSED: ${{ steps.cmd.outputs.refused }}
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          SESSION=$(python -c "from market_time import is_session; print(int(is_session('$TODAY')))")
          [ "$SESSION" = "1" ] || { echo "$TODAY is not a session — nothing to check."; exit 0; }
          NOW=$(TZ=America/New_York date '+%H:%M ET')
          if [ "$REFUSED" = "1" ]; then WHAT="the backup rung arrived at $NOW, past the cutoff, and the session was LOST"; else WHAT="a late GitHub backup rung had to log the cohort at $NOW"; fi
          TITLE="Primary scan trigger did not fire"
          BODY="$TODAY: the Vercel Cron → workflow_dispatch trigger (api/cron-scan.js, ~07:56 ET) did not log today's cohort; $WHAT. Most likely cause: GITHUB_DISPATCH_TOKEN in Vercel expired or was revoked (it is a fine-grained PAT; check its expiry at github.com/settings/personal-access-tokens), or CRON_SECRET changed. Each further morning on the backup rungs alone risks a lost session. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "⚠️ $TITLE" --body "$BODY"; fi
          echo "::warning::$TITLE — $WHAT"
      # TOKEN-EXPIRY EARLY WARNING (2026-10-25). The Vercel trigger passes along the
      # expiry GitHub reports for its token. Warn 14 days ahead, once per open issue.
      - name: Dispatch-token expiry warning
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.token_expires != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXP: ${{ github.event.inputs.token_expires }}
        run: |
          echo "Dispatch token expiry reported: $EXP"
          [ "$EXP" = "none" ] && exit 0
          DAYS=$(python -c "
          import sys, datetime as d
          s=sys.argv[1].replace(' UTC','').strip()
          for fmt in ('%Y-%m-%d %H:%M:%S %z','%Y-%m-%d %H:%M:%S','%Y-%m-%dT%H:%M:%SZ'):
              try:
                  e=d.datetime.strptime(s,fmt); break
              except ValueError: e=None
          if e is None: print(-999); sys.exit()
          if e.tzinfo is None: e=e.replace(tzinfo=d.timezone.utc)
          print((e-d.datetime.now(d.timezone.utc)).days)" "$EXP")
          echo "days remaining: $DAYS"
          [ "$DAYS" = "-999" ] && { echo "::warning::could not parse token expiry '$EXP'"; exit 0; }
          [ "$DAYS" -ge 14 ] && exit 0
          TITLE="Scan-trigger token expires soon"
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          [ -n "$N" ] && { echo "issue #$N already open"; exit 0; }
          gh issue create --title "⏳ $TITLE ($EXP)" --body "GITHUB_DISPATCH_TOKEN (the fine-grained PAT the Vercel cron uses to start the daily scan) expires $EXP — $DAYS day(s) from now. When it expires the primary trigger stops and only the late GitHub backup rungs remain (that is how 2026-10-19 was lost). Regenerate it at github.com/settings/personal-access-tokens (repo joshldavis/ThePickLog only, Actions: Read and write; choose the longest expiry you are comfortable with), then update GITHUB_DISPATCH_TOKEN in Vercel → thepicklog → Settings → Environment Variables and redeploy."
      - name: Run ${{ steps.cmd.outputs.cmd }}
        id: run
        if: steps.cmd.outputs.cmd != 'noop'
        # Output is teed so a FAILED scan can explain itself in public data. pipefail is
        # load-bearing: without it tee's exit code wins and a failed scan reports success.
        run: |
          set -o pipefail
          python ignitionscan.py ${{ steps.cmd.outputs.cmd }} 2>&1 | tee scan_output.log
      # Added 2026-09-03. The pre-open gate was the ONLY failure the public record could
      # explain; every other one — a throttled feed, an unhandled exception, a bad deploy —
      # produced a red run and a missing session with no public trace, readable only with a
      # GitHub login. That cost a full day on 09-03: two dispatches landed INSIDE the window,
      # the scan died in seconds, and nobody outside the repo could see why. A session lost
      # to a broken scanner is exactly as absent as one lost to a late cron, so it goes in
      # the same ledger. Runs BEFORE the committer below, which pushes the row.
      - name: Explain an unexplained scan failure in the session ledger
        if: failure() && steps.cmd.outputs.cmd == 'scan'
        env:
          SCAN_LOG: scan_output.log
        run: python ignitionscan.py record-failure
      # A refused scan exits 1 by design, which skips every step below — including
      # the commit. That is how 2026-08-27 and 08-28 left no public trace at all:
      # the scanner recorded the refusal, then the job died before anything could
      # be pushed. The skipped-session ledger is the one artifact that MUST survive
      # a failed scan, so it gets its own committer that runs on failure.
      - name: Publish skipped-session ledger (runs even when the scan is refused)
        if: always() && (steps.cmd.outputs.refused == '1' || (failure() && steps.cmd.outputs.cmd == 'scan'))
        run: |
          [ -f skipped_sessions.csv ] || exit 0
          git config user.name "joshldavis"
          git config user.email "davis1163@gmail.com"
          git add skipped_sessions.csv
          if git diff --cached --quiet; then
            echo "No new skipped session to record."
          else
            git commit -m "data: skipped session $(TZ=America/New_York date +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed; retrying"; sleep 5
            done
          fi
      # Grading-integrity gate (added 2026-08-09 after the weekly audit found five
      # picks weeks past their grade date with no outcomes row and no note, four of
      # them A-tier). The grader may defer a pick while a fetch is transient; it may
      # never defer one forever. Ungradeable names (halts, delistings) concentrate in
      # the hottest tier, so silently dropping them flatters it by survivorship.
      - name: Verify no pick was silently dropped
        if: steps.cmd.outputs.cmd == 'grade'
        run: python ignitionscan.py check-grading
      # v0.3 market-wide scan (H-UNIV1, registered 2026-07-08; free-feed amendment
      # 2026-07-09): criteria-defined universe. Default source = FREE Yahoo screeners
      # (UNIV_SOURCE=yahoo, cohort tag v0.3-yf) -- no keys, no cost. Setting
      # UNIV_SOURCE=alpaca + the Alpaca secrets upgrades discovery to SIP later
      # (new sub-cohort tag v0.3-alpaca). continue-on-error so a v0.3 data problem
      # NEVER blocks the v0.2 scan commit -- the step still shows red for visibility.
      - name: Market-wide v0.3 scan
        if: steps.cmd.outputs.cmd == 'scan'
        continue-on-error: true
        env:
          UNIV_SOURCE: yahoo
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: sip
        run: python ignitionscan.py scan-market
      # H-CTRL (registered 2026-07-07, amended 2026-07-29): grade the eligible-but-
      # UNPUBLISHED candidates forward so the discriminant test becomes answerable at all.
      # Append-only into control_outcomes.csv. continue-on-error + the script's own
      # catch-all mean a control-data problem can never block the picks/outcomes commit.
      # PAPER TRADER ENTRY (moved here 2026-10-25). H-V3-PAPER buys today's v0.3 picks with
      # market-on-open (OPG) orders, which Alpaca accepts only until ~09:28 ET. On its own
      # GitHub cron (0 12 * * 1-5) the run arrived 4-5h late, after the open, so every
      # entry would have been rejected. Running it here, right after the v0.3 picks are
      # logged, inherits the scan's pre-open guarantee. Idempotent by pick_id; no-ops
      # without the ALPACA secrets; non-fatal so it can never cost a scan.
      - name: Paper trader — enter (H-V3-PAPER, pre-open OPG)
        if: steps.cmd.outputs.cmd == 'scan'
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python paper_trader.py enter || echo "paper trader enter skipped (non-fatal)"
      - name: Grade control pool (H-CTRL)
        if: steps.cmd.outputs.cmd == 'grade'
        continue-on-error: true
        run: python grade_controls.py || echo "control grading skipped (non-fatal)"

      # EXPERIMENT 02 (H-EXP02, registered 2026-07-29): the 2-period RSI mean-reversion
      # trade on a frozen 40-name large-cap universe, scored against a day-matched control.
      # Scan logs signals before the next open; grade fills outcomes 5 sessions later.
      # continue-on-error + the script's own catch-all: this can never block the v0.2/v0.3 commit.
      - name: Experiment 02 — RSI(2) scan
        if: steps.cmd.outputs.cmd == 'scan'
        continue-on-error: true
        run: python rsi2_scanner.py scan || echo "exp02 scan skipped (non-fatal)"
      - name: Experiment 02 — RSI(2) grade
        if: steps.cmd.outputs.cmd == 'grade'
        continue-on-error: true
        run: python rsi2_scanner.py grade || echo "exp02 grade skipped (non-fatal)"

      # EXPERIMENT HARNESS (shipped 2026-07-31): runs every experiment declared in
      # experiment_harness.py — currently EXP03 (MACD crossover). Forward-only, append-only,
      # day-matched control enforced for all of them. Non-fatal by construction.
      - name: Experiment harness — scan
        if: steps.cmd.outputs.cmd == 'scan'
        continue-on-error: true
        run: python experiment_harness.py scan || echo "harness scan skipped (non-fatal)"
      - name: Experiment harness — grade
        if: steps.cmd.outputs.cmd == 'grade'
        continue-on-error: true
        run: python experiment_harness.py grade || echo "harness grade skipped (non-fatal)"
      # family_verdict.py (2026-10-23) — the single 2026-11-02 family read: locks H-EXP02 once
      # and applies the declared BH-FDR across EXP02-EXP09 (m=8). A no-op before 11-02 that
      # prints nothing about the data. Runs after the harness so its locks exist. Non-fatal.
      - name: Family verdict (EXP02 lock + BH-FDR, gated to 2026-11-02)
        continue-on-error: true
        run: python family_verdict.py || echo "family verdict skipped (non-fatal)"

      # CALENDAR EXPERIMENTS (EXP04 turn-of-month + EXP05 overnight-vs-intraday,
      # batch #9 registered 2026-08-06): timing claims on QQQ (SPY replication read)
      # scored against TIME-matched controls — see calendar_eval.py header for why the
      # harness's cross-sectional day-matched control does not apply to timing claims.
      # No scan step exists by construction: sessions derive from the exchange calendar,
      # so the Experiment-01 pre-open failure mode is impossible here. Non-fatal.
      - name: Calendar experiments (EXP04/05) — grade
        if: steps.cmd.outputs.cmd == 'grade'
        continue-on-error: true
        run: python calendar_eval.py grade || echo "calendar grade skipped (non-fatal)"

      - name: Refresh Finding-A-aware brief
        run: python ignitionscan.py brief || true
      - name: Rebuild Test-mode leaderboard (house + user rules)
        # Daily refresh so a newly registered hypothesis reaches the board within a
        # day (not just the weekly report). Non-fatal: hypo_eval's self-test aborts
        # only on genuine parity drift, and must never block the picks/outcomes commit.
        run: |
          python fetch_user_rules.py || true
          USER_RULES_PATH=hypotheses/user_rules.json python hypo_eval.py || echo "leaderboard rebuild skipped (non-fatal)"
      # H-RISK1 / H-RISK2 (registered 2026-07-29, batch #6): forward evaluation of the
      # magnitude-not-direction claim + the calibrated drawdown gauge. Appends one weekly
      # snapshot per cohort to risk_snapshots.csv and rewrites reports/risk-eval-LATEST.md.
      # Non-fatal: this must never block the picks/outcomes commit.
      - name: Evaluate H-RISK1/H-RISK2
        continue-on-error: true
        run: python risk_eval.py || echo "risk eval skipped (non-fatal)"

      # filing_lens GATE 3 — SHADOW MODE (added 2026-09-28). Reads the prefiltered SEC
      # filings of the picks this scan just logged through TypeSafe AI's Jev (pinned
      # model) and appends every answer to filing_events.jsonl. LOGS ONLY: nothing it
      # returns touches picks.csv, edgar_snapshot.csv, a grade, or a count, and its
      # routing column acts on nothing. It runs AFTER both scans so the pre-open rule
      # never waits on an outside model; continue-on-error + a 10-minute cap mean it can
      # never block the data commit. With no JEV_API_KEY secret it is a logged no-op.
      # Idempotent by pick_id, capped at FILING_LENS_MAX_READS filings per run.
      - name: filing_lens shadow read (gate 3, logs only)
        if: steps.cmd.outputs.cmd == 'scan'
        continue-on-error: true
        timeout-minutes: 10
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_MODEL: jev-1.13.0
          FILING_LENS_QUESTIONS: v2
          FILING_LENS_SHA: ${{ github.sha }}
          FILING_LENS_MAX_READS: "40"
        run: python filing_lens.py --shadow || echo "filing_lens shadow skipped (non-fatal)"
      - name: Seal integrity ledger (tamper-evident hash chain)
        # Records SHA-256 of picks/outcomes/paths into integrity_ledger.csv, chained
        # to the prior row so any later edit to a past entry is provable. Non-fatal:
        # a hashing hiccup must never block the data commit.
        if: steps.cmd.outputs.cmd != 'noop'
        run: python log_integrity.py --event=${{ steps.cmd.outputs.cmd }} || echo "integrity seal skipped (non-fatal)"
      - name: Commit data
        id: commit
        run: |
          # Commit as the repo owner so Vercel authorizes the auto-deploy
          # (Vercel blocks deploys from unrecognized commit authors).
          git config user.name "joshldavis"
          git config user.email "davis1163@gmail.com"
          [ -f picks.csv ] && git add picks.csv || true
          [ -f candidates.csv ] && git add candidates.csv || true
          [ -f control_outcomes.csv ] && git add control_outcomes.csv || true
          [ -f rsi2_signals.csv ] && git add rsi2_signals.csv || true
          [ -f rsi2_outcomes.csv ] && git add rsi2_outcomes.csv || true
          [ -f paper_trades.csv ] && git add paper_trades.csv || true
          [ -d experiments ] && git add experiments || true
          [ -f reports/experiments-LATEST.md ] && git add reports/experiments-LATEST.md || true
          [ -f reports/family-verdict-LATEST.md ] && git add reports/family-verdict-LATEST.md || true
          [ -f reports/calendar-experiments-LATEST.md ] && git add reports/calendar-experiments-LATEST.md || true
          [ -f risk_snapshots.csv ] && git add risk_snapshots.csv || true
          [ -f reports/risk-eval-LATEST.md ] && git add reports/risk-eval-LATEST.md || true
          [ -f outcomes.csv ] && git add outcomes.csv || true
          [ -f paths.csv ] && git add paths.csv || true
          [ -f edgar_snapshot.csv ] && git add edgar_snapshot.csv || true
          [ -f filing_events.jsonl ] && git add filing_events.jsonl || true
          [ -f leaderboard.json ] && git add leaderboard.json || true
          [ -f integrity_ledger.csv ] && git add integrity_ledger.csv || true
          [ -f skipped_sessions.csv ] && git add skipped_sessions.csv || true
          [ -f scale_preflight.csv ] && git add scale_preflight.csv || true
          [ -f reports/brief-LATEST.md ] && git add reports/brief-LATEST.md || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: ${{ steps.cmd.outputs.cmd }} $(date -u +%F)"
            # Rebase on any commit that landed since checkout, then push (avoids
            # non-fast-forward rejection when runs/manual pushes overlap).
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed; retrying"; sleep 5
            done
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Anchor ledger to Wayback Machine (Internet Archive)
        # Snapshots the public ledger to a store we don't control, so the seal can
        # be checked against an external copy. Non-fatal: archive.org has silent
        # outages and must never break the run. One-run lag is expected (Vercel
        # redeploys async, so this may capture the prior run's ledger) — fine, we
        # anchor history, not the present.
        run: |
          curl -sS -m 90 "https://web.archive.org/save/https://thepicklog.vercel.app/integrity_ledger.csv" > /dev/null || echo "wayback anchor skipped (non-fatal)"
      # Belt-and-braces: the GitHub→Vercel webhook occasionally skips a push
      # (observed 2×on 2026-07-02), leaving the site a day stale. If the
      # VERCEL_DEPLOY_HOOK secret is set (Vercel → Project → Settings → Git →
      # Deploy Hooks, then GitHub → repo Settings → Secrets → Actions), fire it
      # after every push. Duplicate deploys are harmless; a missed one isn't.
      - name: Deploy-hook fallback
        if: steps.commit.outputs.pushed == '1'
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" >/dev/null && echo "deploy hook fired"
          else
            echo "VERCEL_DEPLOY_HOOK secret not set — relying on the git webhook alone."
          fi
      # Offsite backup: a copy of the forward log + hash chain stored in GitHub's
      # artifact store, INDEPENDENT of git history. If the repo is ever force-pushed
      # or corrupted, these snapshots survive. Runs even if there was nothing to commit.
      - name: Offsite backup — upload log + ledger as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-log-${{ github.run_id }}
          path: |
            picks.csv
            candidates.csv
            control_outcomes.csv
            rsi2_signals.csv
            rsi2_outcomes.csv
            experiments
            risk_snapshots.csv
            outcomes.csv
            paths.csv
            leaderboard.json
            integrity_ledger.csv
          if-no-files-found: warn
          retention-days: 90
      # Dead-man's-switch: ping a healthchecks.io monitor when the SCAN succeeds.
      # If a run is ever skipped, disabled (GitHub auto-disables cron after 60 days
      # of repo inactivity), or errors out, the ping stops and healthchecks.io
      # emails Josh. Set HEALTHCHECK_URL in repo Settings → Secrets → Actions.
      # See INTEGRITY.md.
      #
      # NARROWED TO THE SCAN, 2026-08-29. This was `if: success()`, which meant the
      # nightly GRADE run pinged the monitor too — so through the 08-27/08-28 scan
      # outage the monitor stayed green while the thing it exists to watch was not
      # running. Same defect as the old watchdog: a health signal that a healthy
      # sibling job can satisfy tells you nothing about the job that died. The scan
      # is the load-bearing half (a missed session is unrecoverable; a missed grade
      # just retries tomorrow), so the scan alone owns the ping.
      - name: Dead-man's-switch ping (healthchecks.io)
        if: success() && steps.cmd.outputs.cmd == 'scan'
        run: |
          URL="${{ secrets.HEALTHCHECK_URL }}"
          if [ -z "$URL" ]; then
            echo "HEALTHCHECK_URL secret not set — dead-man's-switch inactive."
            exit 0
          fi
          # PING ON EVIDENCE (2026-09-23). A pre-06:00 rung exits 0 having written
          # nothing, and under the old condition it pinged anyway - so a day whose only
          # punctual dispatches were too early read as healthy while no cohort existed.
          # Same defect as the grade run feeding the switch (fixed 08-29): the signal
          # must be satisfiable only by the thing it watches. The evidence is a cohort.
          TODAY=$(TZ=America/New_York date +%F)
          if [ -f picks.csv ] && cut -d, -f3 picks.csv | grep -qxF "$TODAY"; then
            curl -fsS -m 10 "$URL" >/dev/null && echo "healthcheck pinged - cohort for $TODAY present"
          else
            echo "No cohort for $TODAY - not pinging; a later rung can still scan."
          fi
      # A refused session no longer fails the build, so THIS is the alarm. /fail puts
      # the check into a down state at once; skipped_sessions.csv says which session
      # was lost and why. Without this, a green run would be the only outward sign.
      - name: Dead-man's-switch - report the lost session
        if: steps.cmd.outputs.refused == '1'
        run: |
          URL="${{ secrets.HEALTHCHECK_URL }}"
          [ -n "$URL" ] || exit 0
          curl -fsS -m 10 "$URL/fail" >/dev/null && echo "healthcheck /fail sent - session refused, cohort unrecoverable"
