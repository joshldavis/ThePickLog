# ThePickLog — weekly forward-log report. Runs on GitHub's servers (no Mac/wifi).
# Summarizes the immutable pick log into reports/forward-YYYY-MM-DD.md + reports/LATEST.md
# so progress is trackable from a phone via GitHub while Josh is away. No API key needed.
name: ThePickLog weekly report

on:
  workflow_dispatch:          # allow manual run any time
  schedule:
    - cron: "0 14 * * 6"      # Saturdays ~10am ET (UTC; shifts 1h in winter), after Fri grade

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate forward-log report
        run: python weekly_report.py
      - name: Bayesian read-out (H-EX1 posterior)   # stdlib-only, deterministic; selftests abort on failure
        run: python bayes_h_ex1.py
      - name: Fetch user-registered hypotheses (Phase 1)
        run: python fetch_user_rules.py   # → hypotheses/user_rules.json (non-fatal, stdlib)
      - name: Compete Test-mode leaderboard + weekly stability snapshot
        # SNAPSHOT=1 appends one weekly point per rule to hypotheses/snapshots.json so
        # the 'stability' field (sign-holds-across-≥3-weeks) has history. Weekly ONLY —
        # the daily rebuild recomputes stability but never adds a point.
        env:
          USER_RULES_PATH: hypotheses/user_rules.json
          SNAPSHOT: "1"
        run: python hypo_eval.py   # merges house registry.json + fetched user rules → leaderboard.json
      - name: Install deps for exit study
        run: pip install yfinance
      - name: Run exit-rule study (daily-resolution, in-sample)
        run: python exit_sim.py || true   # network/data hiccup must not block the report commit
      - name: Seal integrity ledger (tamper-evident hash chain)
        # Weekly seal of the forward log; chained to the daily seals. Non-fatal.
        run: python log_integrity.py --event=report || echo "integrity seal skipped (non-fatal)"
      - name: Commit report
        id: commit
        run: |
          # Author as the repo owner so Vercel authorizes the auto-deploy.
          git config user.name "joshldavis"
          git config user.email "davis1163@gmail.com"
          git add reports/ leaderboard.json
          [ -f hypotheses/snapshots.json ] && git add hypotheses/snapshots.json || true
          [ -f integrity_ledger.csv ] && git add integrity_ledger.csv || true
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "report: forward-log snapshot $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed; retrying"; sleep 5
            done
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Anchor ledger to Wayback Machine (Internet Archive)
        # Snapshots the public ledger to a store we don't control, so the seal can
        # be checked against an external copy. Non-fatal: archive.org has silent
        # outages and must never break the run. One-run lag is expected (Vercel
        # redeploys async, so this may capture the prior run's ledger) — fine, we
        # anchor history, not the present.
        run: |
          curl -sS -m 90 "https://web.archive.org/save/https://thepicklog.vercel.app/integrity_ledger.csv" > /dev/null || echo "wayback anchor skipped (non-fatal)"
      # Belt-and-braces: the GitHub→Vercel webhook occasionally skips a push
      # (observed 2× on 2026-07-02). Fire the Deploy Hook if the secret is set;
      # duplicate deploys are harmless, a missed one leaves the site stale.
      - name: Deploy-hook fallback
        if: steps.commit.outputs.pushed == '1'
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" >/dev/null && echo "deploy hook fired"
          else
            echo "VERCEL_DEPLOY_HOOK secret not set — relying on the git webhook alone."
          fi
      - name: Offsite backup — upload log + ledger as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-log-report-${{ github.run_id }}
          path: |
            picks.csv
            outcomes.csv
            paths.csv
            leaderboard.json
            integrity_ledger.csv
          if-no-files-found: warn
          retention-days: 90
      - name: Dead-man's-switch ping (healthchecks.io)
        if: success()
        run: |
          if [ -n "${{ secrets.HEALTHCHECK_URL_WEEKLY }}" ]; then
            curl -fsS -m 10 "${{ secrets.HEALTHCHECK_URL_WEEKLY }}" >/dev/null && echo "weekly healthcheck pinged"
          else
            echo "HEALTHCHECK_URL_WEEKLY secret not set — weekly dead-man's-switch inactive."
          fi
