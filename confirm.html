<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirm your email — ThePickLog</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--a-text:#31b3aa;--bg:#0a0e14;--panel:#121826;--line:#1f2937;--tx:#e6edf3;--dim:#8b97a7;
        --a:#1f6f6b;--green:#2ec27e;--red:#f0506e;--amber:#f5b14c;--blue:#4c9ff5;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{max-width:520px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:30px 32px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;color:var(--tx);text-decoration:none;margin-bottom:20px}
  .spark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--a),#8fd0cb);display:grid;place-items:center;color:#1a0f0a;font-size:14px}
  h1{font-size:24px;margin:0 0 10px;letter-spacing:-.02em}
  p{margin:0 0 12px;color:var(--dim);font-size:15px}
  a{color:var(--blue)}
  .btn{display:inline-block;background:var(--a);color:#fff;border:0;border-radius:10px;padding:11px 18px;
       font:inherit;font-weight:700;font-size:14.5px;text-decoration:none;margin-top:8px}
  .ok{color:var(--green)} .err{color:var(--red)}

  /* ===== a11y baseline — UI audit 2026-08-19 =====
     3.1 a visible focus ring everywhere (there were 2 :focus rules on the whole site)
     3.2 footer links to a 24px touch target (they were 14px)
     3.7 skip-to-content, so keyboard users don't tab 12 nav links on every page */
  .skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--panel,#121826);
    color:var(--blue,#4c9ff5);border:1px solid var(--blue,#4c9ff5);border-radius:0 0 8px 0;
    padding:10px 16px;font-weight:600;font-size:14px;text-decoration:none}
  .skip:focus{left:0}
  :focus-visible{outline:2px solid var(--blue,#4c9ff5);outline-offset:2px;border-radius:3px}
  .foot a,footer a{display:inline-block;padding:5px 2px}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="card">
  <a class="logo" href="index.html"><span class="spark">⛓</span> ThePickLog</a>
  <h1 id="h">Confirming…</h1>
  <div id="body"><p>One moment.</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB={url:"https://qkdgijiotxxndrfagexr.supabase.co",key:"sb_publishable_BPnBKNu7BbWgPvpMI_PhIg_G_BBwfm3"};
  const TIERS={member:"Member",lab:"Lab access",any:"the waiting list"};
  const h=document.getElementById("h"), body=document.getElementById("body");
  function show(title, html, cls){ h.textContent=title; if(cls) h.className=cls; body.innerHTML=html; }

  (async ()=>{
    const _q=new URLSearchParams(location.search);
    // Accept both spellings: the site has always used ?t=, but confirmation
    // emails have gone out with ?token=. Honour either so no link is dead.
    const token=_q.get("t")||_q.get("token");
    if(!token){
      show("That link looks incomplete","<p>The confirmation link needs its token. Try clicking the link in the email again, or paste the whole URL into the address bar.</p><a class=\"btn\" href=\"index.html\">Back to the site</a>","err");
      return;
    }
    if(!window.supabase){
      show("Couldn't reach the server","<p>Your browser couldn't load the client library — an extension or network filter may be blocking it. Try again, or send a note through the <a href=\"about.html#corrections\">contact form</a> and we'll confirm you by hand.</p>","err");
      return;
    }
    try{
      const sb=window.supabase.createClient(SB.url,SB.key);
      const {data,error}=await sb.rpc("is_confirm_waitlist",{p_token:token});
      if(error) throw error;
      if(data && data.ok){
        const tier=TIERS[data.tier]||"the waiting list";
        show("You're confirmed",
          `<p>You're on the list for <b>${tier}</b>. We'll email you once — when it opens — and not otherwise.</p>
           <p>Nothing is for sale today, and the verdicts stay free and public regardless. While you wait, the
           experiments are the interesting part.</p>
           <a class="btn" href="experiments.html">See the experiments →</a>`, "ok");
      } else {
        show("That link didn't work",
          `<p>This confirmation link is not recognised. It may have been mistyped, or truncated by an email client.</p>
           <p>Send a note through the <a href="about.html#corrections">contact form</a> and we'll sort it out.</p>
           <a class="btn" href="index.html">Back to the site</a>`, "err");
      }
    }catch(e){
      show("Something went wrong",
        `<p>We couldn't confirm you just now. Try the link again in a moment, or send a note through the
         <a href="about.html#corrections">contact form</a>.</p>
         <a class="btn" href="index.html">Back to the site</a>`, "err");
    }
  })();
</script>
</body>
</html>
